name: Compila prototipo Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/**"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepara Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installa piattaforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test e compilazione APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Pubblica APK sperimentale
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reteviva-prototipo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
